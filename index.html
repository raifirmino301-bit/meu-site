
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Casa de Renato</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      background: #100d14;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { color: #e8c8ff; }

    canvas {
      display: block;
      width: min(800px, 96vw);
      height: auto;
      margin: 12px auto;
      border: 3px solid #6c4a78;
      background: #211d22;
      touch-action: none;
    }

    #mensagem {
      min-height: 24px;
      color: #ffb8c8;
    }

    #controles {
      display: grid;
      grid-template: 56px 56px / 64px 64px 64px;
      gap: 6px;
      justify-content: center;
      margin: 14px auto;
      touch-action: none;
    }

    #controles button, #reiniciar {
      border: 2px solid #b995cb;
      border-radius: 12px;
      background: #392944;
      color: white;
      user-select: none;
    }

    #controles button {
      font-size: 26px;
      touch-action: none;
    }

    #cima { grid-area: 1 / 2; }
    #esquerda { grid-area: 2 / 1; }
    #baixo { grid-area: 2 / 2; }
    #direita { grid-area: 2 / 3; }

    #reiniciar {
      padding: 10px 18px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>A Casa de Renato</h1>
  <div id="info"></div>
  <div id="mensagem">Pegue os três itens e encontre a saída verde!</div>

  <canvas id="jogo" width="800" height="600"></canvas>

  <div id="controles">
    <button id="cima" aria-label="Cima">⬆️</button>
    <button id="esquerda" aria-label="Esquerda">⬅️</button>
    <button id="baixo" aria-label="Baixo">⬇️</button>
    <button id="direita" aria-label="Direita">➡️</button>
  </div>

  <p><button id="reiniciar" type="button">Recomeçar do início</button></p>

  <script>
    "use strict";

    const canvas = document.getElementById("jogo");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const mensagem = document.getElementById("mensagem");

    const tamanho = 25;
    const colunas = 32;
    const linhas = 24;
    const teclas = Object.create(null);

    const nomesFases = [
      "Fase 1 — A Casa de Renato",
      "Fase 2 — Hospital abandonado",
      "Fase 3 — Presídio",
      "Fase 4 — Museu",
      "Fase 5 — Terror: Hard AI Sim"
    ];

    const temas = [
      { chao: "#29252b", parede: "#514454", detalhe: "#75657a" },
      { chao: "#26343a", parede: "#46616b", detalhe: "#9bcbd3" },
      { chao: "#292a32", parede: "#555565", detalhe: "#9999aa" },
      { chao: "#383124", parede: "#77613c", detalhe: "#d6bd7b" },
      { chao: "#21151d", parede: "#552b3b", detalhe: "#b75b75" }
    ];

    let parte = 1;
    let mapa = [];
    let acabou = false;
    let ultimoTempo = performance.now();
    let contadorSaida = false;

    const jogador = {
      x: 62.5,
      y: 62.5,
      velocidade: 180
    };

    const renato = {
      x: 737.5,
      y: 537.5,
      velocidade: 150
    };

    const saida = { x: 29, y: 2 };

    const itens = [
      { nome: "Diamante", emoji: "💎", x: 4, y: 20, pego: false },
      { nome: "Moeda", emoji: "🪙", x: 27, y: 4, pego: false },
      { nome: "Pintura", emoji: "🖼️", x: 18, y: 11, pego: false }
    ];

    const fotoYarlei = new Image();
    fotoYarlei.src = "yarlei.jpg";
    function criarMapa(fase) {
      const novo = Array.from({ length: linhas }, (_, y) =>
        Array.from({ length: colunas }, (_, x) =>
          x === 0 || y === 0 || x === colunas - 1 || y === linhas - 1
            ? "#"
            : " "
        )
      );

      function horizontal(y, inicio, fim, abertura) {
        for (let x = inicio; x <= fim; x++) {
          if (x !== abertura) novo[y][x] = "#";
        }
      }

      function vertical(x, inicio, fim, abertura) {
        for (let y = inicio; y <= fim; y++) {
          if (y !== abertura) novo[y][x] = "#";
        }
      }

      if (fase === 1) {
        horizontal(7, 5, 26, 10);
        horizontal(15, 3, 24, 8);
        vertical(12, 3, 19, 10);
        vertical(22, 4, 21, 12);

        const obstaculos = [
          [3, 5], [4, 5], [8, 3], [9, 3], [15, 4], [16, 4],
          [25, 5], [27, 9], [5, 11], [6, 11], [9, 12], [10, 12],
          [14, 9], [15, 9], [19, 10], [20, 10], [3, 18], [7, 19],
          [8, 19], [14, 19], [18, 20], [19, 20], [25, 16], [27, 18],
          [6, 3], [18, 3], [28, 6], [2, 9], [8, 10], [17, 12],
          [26, 13], [10, 20], [16, 17], [29, 15]
        ];

        for (const [x, y] of obstaculos) {
          novo[y][x] = "#";
        }
      } else if (fase === 2) {
        // Hospital: corredores compridos e salas laterais.
        horizontal(6, 2, 29, 15);
        horizontal(12, 2, 29, 7);
        horizontal(18, 2, 29, 24);
        vertical(9, 3, 21, 8);
        vertical(20, 2, 21, 15);
        vertical(26, 3, 21, 10);
      } else if (fase === 3) {
        // Presídio: corredores de celas.
        horizontal(5, 2, 29, 25);
        horizontal(11, 2, 29, 7);
        horizontal(17, 2, 29, 23);
        vertical(8, 3, 21, 15);
        vertical(16, 3, 21, 8);
        vertical(24, 3, 21, 19);
      } else if (fase === 4) {
        // Museu: salas e galerias.
        horizontal(7, 2, 29, 5);
        horizontal(14, 2, 29, 26);
        horizontal(20, 2, 29, 12);
        vertical(11, 3, 21, 18);
        vertical(21, 3, 21, 9);
        vertical(27, 3, 19, 15);
      } else {
        // Fase de terror: labirinto mais fechado.
        horizontal(4, 2, 29, 10);
        horizontal(8, 2, 29, 25);
        horizontal(12, 2, 29, 6);
        horizontal(16, 2, 29, 23);
        horizontal(20, 2, 29, 12);
        vertical(7, 2, 21, 18);
        vertical(14, 2, 21, 5);
        vertical(21, 2, 21, 15);
        vertical(27, 2, 21, 10);
      }

      // Mantém livres o início, a saída e os locais dos itens.
      const celulasLivres = [
        [2, 2],
        [29, 21],
        [saida.x, saida.y],
        ...itens.map((item) => [item.x, item.y])
      ];

      for (const [x, y] of celulasLivres) {
        novo[y][x] = " ";
      }

      return novo;
    }

    function atualizarInfo() {
      const coletados = itens.filter((item) => item.pego).length;
      info.textContent =
        `${nomesFases[parte - 1]} — Itens: ${coletados}/${itens.length}`;
    }

    function parede(x, y) {
      const coluna = Math.floor(x / tamanho);
      const linha = Math.floor(y / tamanho);
      return !mapa[linha] || mapa[linha][coluna] === "#";
    }

    function podeMover(x, y, raio = 9) {
      return !parede(x - raio, y - raio) &&
             !parede(x + raio, y - raio) &&
             !parede(x - raio, y + raio) &&
             !parede(x + raio, y + raio);
    }

    function configurarBotao(id, tecla) {
      const botao = document.getElementById(id);

      botao.addEventListener("pointerdown", (evento) => {
        evento.preventDefault();
        teclas[tecla] = true;
        botao.setPointerCapture(evento.pointerId);
      });

      function soltar() {
        teclas[tecla] = false;
      }

      botao.addEventListener("pointerup", soltar);
      botao.addEventListener("pointercancel", soltar);
      botao.addEventListener("lostpointercapture", soltar);
    }

    configurarBotao("cima", "arrowup");
    configurarBotao("baixo", "arrowdown");
    configurarBotao("esquerda", "arrowleft");
    configurarBotao("direita", "arrowright");

    window.addEventListener("keydown", (evento) => {
      const tecla = evento.key.toLowerCase();
      teclas[tecla] = true;

      if (tecla.startsWith("arrow") || tecla === " ") {
        evento.preventDefault();
      }
    });

    window.addEventListener("keyup", (evento) => {
      teclas[evento.key.toLowerCase()] = false;
    });

    function moverJogador(dx, dy) {
      if (podeMover(jogador.x + dx, jogador.y)) {
        jogador.x += dx;
      }

      if (podeMover(jogador.x, jogador.y + dy)) {
        jogador.y += dy;
      }
    }

    function tocarSomAssustador() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;

      const audio = new AudioContextClass();
      const agora = audio.currentTime;
      const oscilador = audio.createOscillator();
      const volume = audio.createGain();

      oscilador.type = "sawtooth";
      oscilador.frequency.setValueAtTime(180, agora);
      oscilador.frequency.exponentialRampToValueAtTime(38, agora + 1.2);

      volume.gain.setValueAtTime(0.001, agora);
      volume.gain.exponentialRampToValueAtTime(0.3, agora + 0.08);
      volume.gain.exponentialRampToValueAtTime(0.001, agora + 1.4);

      oscilador.connect(volume);
      volume.connect(audio.destination);
      oscilador.start(agora);
      oscilador.stop(agora + 1.4);

      oscilador.addEventListener("ended", () => audio.close());
    }

    function acharProximoPasso() {
      const inicio = {
        x: Math.floor(renato.x / tamanho),
        y: Math.floor(renato.y / tamanho)
      };

      const destino = {
        x: Math.floor(jogador.x / tamanho),
        y: Math.floor(jogador.y / tamanho)
      };

      const chave = (p) => `${p.x},${p.y}`;
      const fila = [inicio];
      const anteriores = new Map();
      anteriores.set(chave(inicio), null);

      const direcoes = [[1, 0], [-1, 0], [0, 1], [0, -1]];

      for (let i = 0; i < fila.length; i++) {
        const atual = fila[i];

        if (atual.x === destino.x && atual.y === destino.y) break;

        for (const [dx, dy] of direcoes) {
          const proximo = { x: atual.x + dx, y: atual.y + dy };

          if (
            mapa[proximo.y]?.[proximo.x] !== " " ||
            anteriores.has(chave(proximo))
          ) {
            continue;
          }

          anteriores.set(chave(proximo), atual);
          fila.push(proximo);
        }
      }

      if (!anteriores.has(chave(destino))) return null;

      let passo = destino;

      while (
        anteriores.get(chave(passo)) !== null &&
        chave(anteriores.get(chave(passo))) !== chave(inicio)
      ) {
        passo = anteriores.get(chave(passo));
      }

      return passo;
    }

    function desenhar() {
      const tema = temas[parte - 1];
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenha o mapa da fase atual.
      for (let y = 0; y < linhas; y++) {
        for (let x = 0; x < colunas; x++) {
          ctx.fillStyle = mapa[y][x] === "#" ? tema.parede : tema.chao;
          ctx.fillRect(x * tamanho, y * tamanho, tamanho, tamanho);

          if (mapa[y][x] === "#") {
            ctx.strokeStyle = tema.detalhe;
            ctx.strokeRect(x * tamanho, y * tamanho, tamanho, tamanho);
          }
        }
      }

      // Enfeites diferentes para cada cenário.
      ctx.textAlign = "center";
      ctx.font = "18px Arial";

      if (parte === 2) {
        ctx.fillStyle = "#b8f1ff";
        ctx.fillText("✚", 175, 160);
        ctx.fillText("✚", 575, 360);
        ctx.fillText("✚", 375, 510);
      } else if (parte === 3) {
        ctx.fillStyle = "#d7d7e0";
        ctx.fillText("▥", 175, 160);
        ctx.fillText("▥", 575, 360);
        ctx.fillText("▥", 375, 510);
      } else if (parte === 4) {
        ctx.fillStyle = "#ffe08a";
        ctx.fillText("🖼️", 175, 160);
        ctx.fillText("🖼️", 575, 360);
        ctx.fillText("🖼️", 375, 510);
      } else if (parte === 5) {
        ctx.fillStyle = "#ff617c";
        ctx.fillText("☠", 175, 160);
        ctx.fillText("☠", 575, 360);
        ctx.fillText("☠", 375, 510);
      }

      ctx.textAlign = "left";

      // Saída.
      ctx.fillStyle = "#38b764";
      ctx.fillRect(
        saida.x * tamanho,
        saida.y * tamanho,
        tamanho,
        tamanho
      );
      ctx.fillStyle = "white";
      ctx.font = "11px Arial";
      ctx.fillText("SAÍDA", saida.x * tamanho - 5, saida.y * tamanho - 5);

      // Itens não coletados.
      for (const item of itens) {
        if (!item.pego) {
          ctx.font = "20px Arial";
          ctx.fillText(
            item.emoji,
            item.x * tamanho + 2,
            item.y * tamanho + 20
          );
        }
      }

      // Jogador.
      ctx.fillStyle = "#79d8ff";
      ctx.beginPath();
      ctx.arc(jogador.x, jogador.y, 10, 0, Math.PI * 2);
      ctx.fill();

      // Renato.
      ctx.fillStyle = parte === 5 ? "#ff1744" : "#bd334b";
      ctx.beginPath();
      ctx.arc(
        renato.x,
        renato.y,
        parte === 5 ? 14 : 12,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.font = "12px Arial";
      ctx.fillText("Renato", renato.x - 19, renato.y - 17);

      // Yarlei aparece discretamente no cenário de terror, se a imagem existir.
      if (parte === 5 && fotoYarlei.complete && fotoYarlei.naturalWidth > 0) {
        ctx.globalAlpha = 0.22;
        ctx.drawImage(fotoYarlei, 360, 250, 80, 95);
        ctx.globalAlpha = 1;
      }

      // Tela de vitória ou derrota.
      if (acabou) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "white";
        ctx.font = "bold 25px Arial";
        ctx.fillText(
          mensagem.textContent,
          canvas.width / 2,
          canvas.height / 2
        );
        ctx.textAlign = "left";
      }

      atualizarInfo();
    }
    let tempoEstado = 0;
    let pausaRenato = false;

    function reiniciarPosicoes() {
      jogador.x = 2.5 * tamanho;
      jogador.y = 2.5 * tamanho;
      renato.x = 29.5 * tamanho;
      renato.y = 21.5 * tamanho;
    }

    function iniciarProximaFase() {
      if (parte >= 5) {
        acabou = true;
        mensagem.textContent = "Você venceu e zerou o jogo! 🏆";
        return;
      }

      parte++;
      mapa = criarMapa(parte);
      reiniciarPosicoes();

      itens.forEach((item) => {
        item.pego = false;
      });

      if (parte === 3) {
        itens[0].nome = "Chave principal";
        itens[0].emoji = "🗝️";
        itens[1].nome = "Chave da cela";
        itens[1].emoji = "🔑";
        itens[2].nome = "Chave da saída";
        itens[2].emoji = "🔑";
      } else {
        itens[0].nome = "Diamante";
        itens[0].emoji = "💎";
        itens[1].nome = "Moeda";
        itens[1].emoji = "🪙";
        itens[2].nome = parte === 4 ? "Obra de arte" : "Pintura";
        itens[2].emoji = "🖼️";
      }

      // Renato fica mais rápido em cada fase; na última, não descansa.
      renato.velocidade = [0, 155, 190, 225, 260, 330][parte];
      tempoEstado = 0;
      pausaRenato = false;

      mensagem.textContent =
        parte === 3
          ? "Presídio: encontre as três chaves e escape!"
          : `${nomesFases[parte - 1]}: pegue os itens e encontre a saída!`;

      atualizarInfo();
    }

    function reiniciarJogo() {
      parte = 1;
      acabou = false;
      mapa = criarMapa(parte);
      reiniciarPosicoes();

      itens[0].nome = "Diamante";
      itens[0].emoji = "💎";
      itens[1].nome = "Moeda";
      itens[1].emoji = "🪙";
      itens[2].nome = "Pintura";
      itens[2].emoji = "🖼️";

      itens.forEach((item) => {
        item.pego = false;
      });

      renato.velocidade = 155;
      tempoEstado = 0;
      pausaRenato = false;
      mensagem.textContent =
        "Pegue os três itens e encontre a saída verde!";
      atualizarInfo();
    }

    function atualizar(tempoAtual) {
      const dt = Math.min((tempoAtual - ultimoTempo) / 1000, 0.05);
      ultimoTempo = tempoAtual;

      if (!acabou) {
        let dx = 0;
        let dy = 0;

        if (teclas.arrowup || teclas.w) dy--;
        if (teclas.arrowdown || teclas.s) dy++;
        if (teclas.arrowleft || teclas.a) dx--;
        if (teclas.arrowright || teclas.d) dx++;

        if (dx || dy) {
          const distancia = Math.hypot(dx, dy);
          moverJogador(
            (dx / distancia) * jogador.velocidade * dt,
            (dy / distancia) * jogador.velocidade * dt
          );
        }

        // Coleta os itens ao encostar neles.
        for (const item of itens) {
          if (item.pego) continue;

          const itemX = item.x * tamanho + tamanho / 2;
          const itemY = item.y * tamanho + tamanho / 2;

          if (Math.hypot(jogador.x - itemX, jogador.y - itemY) < 20) {
            item.pego = true;
            mensagem.textContent = `Você pegou: ${item.nome}!`;
          }
        }

        // Renato descansa nas fases 1 a 4. Na fase 5, persegue sem parar.
        if (parte < 5) {
          tempoEstado += dt;

          if (!pausaRenato && tempoEstado >= 20) {
            pausaRenato = true;
            tempoEstado = 0;
            mensagem.textContent = "Renato está descansando. Aproveite!";
          } else if (pausaRenato && tempoEstado >= 8) {
            pausaRenato = false;
            tempoEstado = 0;
            mensagem.textContent = "Renato voltou a perseguir você!";
          }
        } else {
          pausaRenato = false;
        }

        // Renato persegue o jogador usando o caminho do labirinto.
        if (!pausaRenato) {
          const passo = acharProximoPasso();

          if (passo) {
            const alvoX = passo.x * tamanho + tamanho / 2;
            const alvoY = passo.y * tamanho + tamanho / 2;
            const difX = alvoX - renato.x;
            const difY = alvoY - renato.y;
            const distancia = Math.hypot(difX, difY);

            if (distancia > 1) {
              const movimento = Math.min(renato.velocidade * dt, distancia);
              const movimentoX = (difX / distancia) * movimento;
              const movimentoY = (difY / distancia) * movimento;

              if (podeMover(renato.x + movimentoX, renato.y, 10)) {
                renato.x += movimentoX;
              }
              if (podeMover(renato.x, renato.y + movimentoY, 10)) {
                renato.y += movimentoY;
              }
            }
          }

          if (Math.hypot(jogador.x - renato.x, jogador.y - renato.y) < 20) {
            acabou = true;
            mensagem.textContent =
              "Renato pegou você! Toque em Recomeçar do início.";
            tocarSomAssustador();
          }
        }

        // A saída só abre quando os três itens foram encontrados.
        const todosItensPegos = itens.every((item) => item.pego);
        const saidaX = saida.x * tamanho + tamanho / 2;
        const saidaY = saida.y * tamanho + tamanho / 2;
        const pertoDaSaida =
          Math.hypot(jogador.x - saidaX, jogador.y - saidaY) < 20;

        if (!acabou && pertoDaSaida && !contadorSaida) {
          if (todosItensPegos) {
            contadorSaida = true;
            iniciarProximaFase();
            setTimeout(() => {
              contadorSaida = false;
            }, 500);
          } else {
            mensagem.textContent = "A saída está trancada! Encontre os itens.";
          }
        }
      }

      desenhar();
      requestAnimationFrame(atualizar);
    }

    document
      .getElementById("reiniciar")
      .addEventListener("click", reiniciarJogo);

    mapa = criarMapa(parte);
    atualizarInfo();
    requestAnimationFrame(atualizar);
  </script>
</body>
</html>
