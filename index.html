
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Casa de Renato</title>

  <style>
    body {
      margin: 0;
      padding: 12px;
      background: #100d14;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { color: #e8c8ff; }

    canvas {
      display: block;
      width: min(800px, 96vw);
      height: auto;
      margin: 12px auto;
      border: 3px solid #6c4a78;
      background: #211d22;
      touch-action: none;
    }

    #mensagem {
      min-height: 24px;
      color: #ffb8c8;
    }

    #controles {
      display: grid;
      grid-template: 56px 56px / 64px 64px 64px;
      gap: 6px;
      justify-content: center;
      margin: 14px auto;
    }

    button {
      border: 2px solid #b995cb;
      border-radius: 12px;
      background: #392944;
      color: white;
      user-select: none;
      touch-action: none;
    }

    #controles button { font-size: 26px; }
    #cima { grid-area: 1 / 2; }
    #esquerda { grid-area: 2 / 1; }
    #baixo { grid-area: 2 / 2; }
    #direita { grid-area: 2 / 3; }

    #reiniciar {
      padding: 10px 18px;
      font-size: 16px;
      touch-action: auto;
    }
  </style>
</head>
<body>
  <h1>A Casa de Renato</h1>
  <div id="info"></div>
  <div id="mensagem">Pegue os três itens e encontre a saída verde!</div>

  <canvas id="jogo" width="800" height="600"></canvas>

  <div id="controles">
    <button id="cima" aria-label="Cima">⬆️</button>
    <button id="esquerda" aria-label="Esquerda">⬅️</button>
    <button id="baixo" aria-label="Baixo">⬇️</button>
    <button id="direita" aria-label="Direita">➡️</button>
  </div>

  <p><button id="reiniciar" type="button">Recomeçar do início</button></p>

  <script>
    "use strict";

    const canvas = document.getElementById("jogo");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const mensagem = document.getElementById("mensagem");

    const tamanho = 25;
    const colunas = 32;
    const linhas = 24;
    const teclas = Object.create(null);

    const nomesFases = [
      "Fase 1 — A Casa de Renato",
      "Fase 2 — Hospital abandonado",
      "Fase 3 — Presídio",
      "Fase 4 — Museu",
      "Fase 5 — Casa de terror"
    ];

    const temas = [
      { chao: "#29252b", parede: "#514454", detalhe: "#75657a" },
      { chao: "#26343a", parede: "#46616b", detalhe: "#9bcbd3" },
      { chao: "#292a32", parede: "#555565", detalhe: "#9999aa" },
      { chao: "#383124", parede: "#77613c", detalhe: "#d6bd7b" },
      { chao: "#21151d", parede: "#552b3b", detalhe: "#b75b75" }
    ];

    let parte = 1;
    let mapa = [];
    let acabou = false;
    let pausaRenato = false;
    let tempoEstado = 0;
    let ultimoTempo = performance.now();
    let bloqueioSaida = false;

    const jogador = {
      x: 62.5,
      y: 62.5,
      velocidade: 180
    };

    const renato = {
      x: 737.5,
      y: 537.5,
      velocidade: 150
    };

    const saida = { x: 29, y: 2 };

    const itens = [
      { nome: "Diamante", emoji: "💎", x: 4, y: 20, pego: false },
      { nome: "Moeda", emoji: "🪙", x: 27, y: 4, pego: false },
      { nome: "Pintura", emoji: "🖼️", x: 18, y: 11, pego: false }
    ];

    const fotoYarlei = new Image();
    fotoYarlei.src = "yarlei.jpg";

    function criarMapa(fase) {
      const novo = Array.from({ length: linhas }, (_, y) =>
        Array.from({ length: colunas }, (_, x) =>
          x === 0 || y === 0 || x === colunas - 1 || y === linhas - 1
            ? "#"
            : " "
        )
      );

      function paredeHorizontal(y, abertura) {
        for (let x = 2; x < colunas - 2; x++) {
          if (x !== abertura) novo[y][x] = "#";
        }
      }

      function paredeVertical(x, abertura) {
        for (let y = 2; y < linhas - 2; y++) {
          if (y !== abertura) novo[y][x] = "#";
        }
      }

      if (fase === 1) {
        paredeHorizontal(7, 10);
        paredeHorizontal(15, 23);
        paredeVertical(12, 10);
        paredeVertical(22, 16);
      } else if (fase === 2) {
        paredeHorizontal(5, 25);
        paredeHorizontal(10, 7);
        paredeHorizontal(15, 24);
        paredeHorizontal(20, 9);
      } else if (fase === 3) {
        paredeVertical(6, 18);
        paredeVertical(12, 5);
        paredeVertical(18, 18);
        paredeVertical(24, 5);
      } else if (fase === 4) {
        paredeHorizontal(6, 8);
        paredeHorizontal(13, 23);
        paredeHorizontal(19, 10);
        paredeVertical(10, 17);
        paredeVertical(21, 4);
      } else {
        paredeHorizontal(4, 25);
        paredeHorizontal(8, 6);
        paredeHorizontal(12, 25);
        paredeHorizontal(16, 6);
        paredeHorizontal(20, 25);
      }

      const lugaresLivres = [
        [2, 2],
        [29, 21],
        [saida.x, saida.y],
        ...itens.map(item => [item.x, item.y])
      ];

      for (const [x, y] of lugaresLivres) {
        novo[y][x] = " ";
      }

      return novo;
    }

    function atualizarInfo() {
      const coletados = itens.filter(item => item.pego).length;
      info.textContent =
        `${nomesFases[parte - 1]} — Itens: ${coletados}/3`;
    }

    function paredeEm(x, y) {
      const coluna = Math.floor(x / tamanho);
      const linha = Math.floor(y / tamanho);

      return !mapa[linha] || mapa[linha][coluna] === "#";
    }

    function podeMover(x, y, raio = 9) {
      return !paredeEm(x - raio, y - raio) &&
             !paredeEm(x + raio, y - raio) &&
             !paredeEm(x - raio, y + raio) &&
             !paredeEm(x + raio, y + raio);
    }

    function configurarBotao(id, tecla) {
      const botao = document.getElementById(id);

      botao.addEventListener("pointerdown", evento => {
        evento.preventDefault();
        teclas[tecla] = true;
        botao.setPointerCapture(evento.pointerId);
      });

      const soltar = () => {
        teclas[tecla] = false;
      };

      botao.addEventListener("pointerup", soltar);
      botao.addEventListener("pointercancel", soltar);
      botao.addEventListener("lostpointercapture", soltar);
    }

    configurarBotao("cima", "arrowup");
    configurarBotao("baixo", "arrowdown");
    configurarBotao("esquerda", "arrowleft");
    configurarBotao("direita", "arrowright");

    window.addEventListener("keydown", evento => {
      const tecla = evento.key.toLowerCase();
      teclas[tecla] = true;

      if (tecla.startsWith("arrow") || tecla === " ") {
        evento.preventDefault();
      }
    });

    window.addEventListener("keyup", evento => {
      teclas[evento.key.toLowerCase()] = false;
    });

    function moverJogador(dx, dy) {
      if (podeMover(jogador.x + dx, jogador.y)) {
        jogador.x += dx;
      }

      if (podeMover(jogador.x, jogador.y + dy)) {
        jogador.y += dy;
      }
    }

    function acharProximoPasso() {
      const inicio = {
        x: Math.floor(renato.x / tamanho),
        y: Math.floor(renato.y / tamanho)
      };

      const destino = {
        x: Math.floor(jogador.x / tamanho),
        y: Math.floor(jogador.y / tamanho)
      };

      const chave = ponto => `${ponto.x},${ponto.y}`;
      const fila = [inicio];
      const anteriores = new Map();

      anteriores.set(chave(inicio), null);

      const direcoes = [
        [1, 0],
        [-1, 0],
        [0, 1],
        [0, -1]
      ];

      for (let i = 0; i < fila.length; i++) {
        const atual = fila[i];

        if (atual.x === destino.x && atual.y === destino.y) {
          break;
        }

        for (const [dx, dy] of direcoes) {
          const proximo = {
            x: atual.x + dx,
            y: atual.y + dy
          };

          if (
            mapa[proximo.y]?.[proximo.x] !== " " ||
            anteriores.has(chave(proximo))
          ) {
            continue;
          }

          anteriores.set(chave(proximo), atual);
          fila.push(proximo);
        }
      }

      if (!anteriores.has(chave(destino))) {
        return null;
      }

      let passo = destino;

      while (
        anteriores.get(chave(passo)) !== null &&
        chave(anteriores.get(chave(passo))) !== chave(inicio)
      ) {
        passo = anteriores.get(chave(passo));
      }

      return passo;
    }

    function tocarSomAssustador() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;

      const audio = new AudioContextClass();
      const agora = audio.currentTime;
      const oscilador = audio.createOscillator();
      const volume = audio.createGain();

      oscilador.type = "sawtooth";
      oscilador.frequency.setValueAtTime(180, agora);
      oscilador.frequency.exponentialRampToValueAtTime(38, agora + 1.2);

      volume.gain.setValueAtTime(0.001, agora);
      volume.gain.exponentialRampToValueAtTime(0.25, agora + 0.08);
      volume.gain.exponentialRampToValueAtTime(0.001, agora + 1.2);

      oscilador.connect(volume);
      volume.connect(audio.destination);
      oscilador.start(agora);
      oscilador.stop(agora + 1.2);

      oscilador.addEventListener("ended", () => audio.close());
    }
    function desenhar() {
      const tema = temas[parte - 1];
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenha o chão e as paredes do labirinto.
      for (let y = 0; y < linhas; y++) {
        for (let x = 0; x < colunas; x++) {
          const px = x * tamanho;
          const py = y * tamanho;

          ctx.fillStyle = mapa[y][x] === "#" ? tema.parede : tema.chao;
          ctx.fillRect(px, py, tamanho, tamanho);

          if (mapa[y][x] === "#") {
            ctx.strokeStyle = tema.detalhe;
            ctx.strokeRect(px, py, tamanho, tamanho);
          }
        }
      }

      // Decoração visual dos cenários.
      if (parte === 2) {
        // Hospital: camas, travesseiros e cruzes.
        for (const [x, y] of [[3, 3], [14, 8], [23, 15]]) {
          const px = x * tamanho;
          const py = y * tamanho;

          ctx.fillStyle = "#d8edf0";
          ctx.fillRect(px, py, 58, 27);

          ctx.fillStyle = "#86b6bf";
          ctx.fillRect(px + 5, py + 5, 17, 16);

          ctx.fillStyle = "#46616b";
          ctx.fillRect(px + 2, py + 26, 5, 5);
          ctx.fillRect(px + 51, py + 26, 5, 5);

          ctx.fillStyle = "#ff6666";
          ctx.fillRect(px + 38, py + 6, 5, 15);
          ctx.fillRect(px + 33, py + 11, 15, 5);
        }
      } else if (parte === 3) {
        // Presídio: fileiras de grades.
        for (const [x, y] of [[3, 3], [12, 8], [21, 14], [4, 18]]) {
          const px = x * tamanho;
          const py = y * tamanho;

          ctx.fillStyle = "#b9bbc4";
          ctx.fillRect(px, py, 55, 4);
          ctx.fillRect(px, py + 36, 55, 4);

          for (let i = 0; i < 6; i++) {
            ctx.fillRect(px + i * 10, py, 4, 40);
          }
        }
      } else if (parte === 4) {
        // Museu: quadros em molduras douradas.
        const quadros = [
          [3, 3, "#4d9c84"],
          [13, 8, "#bf7459"],
          [23, 15, "#6688c4"]
        ];

        for (const [x, y, cor] of quadros) {
          const px = x * tamanho;
          const py = y * tamanho;

          ctx.fillStyle = "#e0bd67";
          ctx.fillRect(px, py, 55, 43);

          ctx.fillStyle = "#493c2b";
          ctx.fillRect(px + 5, py + 5, 45, 33);

          ctx.fillStyle = cor;
          ctx.fillRect(px + 10, py + 10, 35, 23);

          ctx.fillStyle = "#f0d99c";
          ctx.beginPath();
          ctx.arc(px + 27, py + 21, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (parte === 5) {
        // Terror: iluminação avermelhada e caveiras.
        ctx.fillStyle = "rgba(150, 0, 35, 0.18)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "32px Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff617c";
        ctx.fillText("☠", 100, 150);
        ctx.fillText("☠", 400, 350);
        ctx.fillText("☠", 700, 500);
        ctx.textAlign = "left";
      }

      // Saída.
      ctx.fillStyle = "#38b764";
      ctx.fillRect(
        saida.x * tamanho,
        saida.y * tamanho,
        tamanho,
        tamanho
      );

      ctx.fillStyle = "white";
      ctx.font = "11px Arial";
      ctx.fillText("SAÍDA", saida.x * tamanho - 5, saida.y * tamanho - 5);

      // Itens que ainda não foram coletados.
      for (const item of itens) {
        if (!item.pego) {
          ctx.font = "20px Arial";
          ctx.fillText(
            item.emoji,
            item.x * tamanho + 2,
            item.y * tamanho + 20
          );
        }
      }

      // Jogador.
      ctx.fillStyle = "#79d8ff";
      ctx.beginPath();
      ctx.arc(jogador.x, jogador.y, 10, 0, Math.PI * 2);
      ctx.fill();

      // Renato.
      ctx.fillStyle = parte === 5 ? "#ff1744" : "#bd334b";
      ctx.beginPath();
      ctx.arc(
        renato.x,
        renato.y,
        parte === 5 ? 14 : 12,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.font = "12px Arial";
      ctx.fillText("Renato", renato.x - 19, renato.y - 17);

      // Mostra Yarlei no cenário de terror se yarlei.jpg estiver na mesma pasta.
      if (parte === 5 && fotoYarlei.complete && fotoYarlei.naturalWidth > 0) {
        ctx.globalAlpha = 0.22;
        ctx.drawImage(fotoYarlei, 360, 250, 80, 95);
        ctx.globalAlpha = 1;
      }

      // Mensagem de vitória ou derrota.
      if (acabou) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "white";
        ctx.font = "bold 25px Arial";
        ctx.fillText(mensagem.textContent, canvas.width / 2, canvas.height / 2);
        ctx.textAlign = "left";
      }

      atualizarInfo();
    }
    function reiniciarPosicoes() {
      jogador.x = 2.5 * tamanho;
      jogador.y = 2.5 * tamanho;
      renato.x = 29.5 * tamanho;
      renato.y = 21.5 * tamanho;
    }

    function iniciarProximaFase() {
      if (parte >= 5) {
        acabou = true;
        mensagem.textContent = "Você venceu e zerou o jogo! 🏆";
        return;
      }

      parte++;
      mapa = criarMapa(parte);
      reiniciarPosicoes();

      itens.forEach(item => {
        item.pego = false;
      });

      if (parte === 3) {
        itens[0].nome = "Chave principal";
        itens[0].emoji = "🗝️";
        itens[1].nome = "Chave da cela";
        itens[1].emoji = "🔑";
        itens[2].nome = "Chave da saída";
        itens[2].emoji = "🔑";
      } else {
        itens[0].nome = "Diamante";
        itens[0].emoji = "💎";
        itens[1].nome = "Moeda";
        itens[1].emoji = "🪙";
        itens[2].nome = parte === 4 ? "Obra de arte" : "Pintura";
        itens[2].emoji = "🖼️";
      }

      renato.velocidade = [0, 150, 175, 200, 230, 270][parte];
      tempoEstado = 0;
      pausaRenato = false;

      mensagem.textContent =
        `${nomesFases[parte - 1]}: pegue os três itens e vá até a saída!`;

      atualizarInfo();
    }

    function reiniciarJogo() {
      parte = 1;
      acabou = false;
      bloqueioSaida = false;
      mapa = criarMapa(parte);
      reiniciarPosicoes();

      itens[0].nome = "Diamante";
      itens[0].emoji = "💎";
      itens[1].nome = "Moeda";
      itens[1].emoji = "🪙";
      itens[2].nome = "Pintura";
      itens[2].emoji = "🖼️";

      itens.forEach(item => {
        item.pego = false;
      });

      renato.velocidade = 150;
      tempoEstado = 0;
      pausaRenato = false;
      mensagem.textContent = "Pegue os três itens e encontre a saída verde!";
      atualizarInfo();
    }

    function atualizar(tempoAtual) {
      const dt = Math.min((tempoAtual - ultimoTempo) / 1000, 0.05);
      ultimoTempo = tempoAtual;

      if (!acabou) {
        let dx = 0;
        let dy = 0;

        if (teclas.arrowup || teclas.w) dy--;
        if (teclas.arrowdown || teclas.s) dy++;
        if (teclas.arrowleft || teclas.a) dx--;
        if (teclas.arrowright || teclas.d) dx++;

        if (dx !== 0 || dy !== 0) {
          const distancia = Math.hypot(dx, dy);
          moverJogador(
            dx / distancia * jogador.velocidade * dt,
            dy / distancia * jogador.velocidade * dt
          );
        }

        // Coleta os itens ao encostar neles.
        for (const item of itens) {
          if (item.pego) continue;

          const itemX = item.x * tamanho + tamanho / 2;
          const itemY = item.y * tamanho + tamanho / 2;

          if (Math.hypot(jogador.x - itemX, jogador.y - itemY) < 20) {
            item.pego = true;
            mensagem.textContent = `Você pegou: ${item.nome}!`;
            atualizarInfo();
          }
        }

        // Renato descansa brevemente nas fases 1 a 4.
        if (parte < 5) {
          tempoEstado += dt;

          if (!pausaRenato && tempoEstado >= 20) {
            pausaRenato = true;
            tempoEstado = 0;
            mensagem.textContent = "Renato está descansando. Aproveite!";
          } else if (pausaRenato && tempoEstado >= 6) {
            pausaRenato = false;
            tempoEstado = 0;
            mensagem.textContent = "Renato voltou a perseguir você!";
          }
        } else {
          pausaRenato = false;
        }

        // Renato encontra o caminho pelo labirinto até o jogador.
        if (!pausaRenato) {
          const passo = acharProximoPasso();

          if (passo) {
            const alvoX = passo.x * tamanho + tamanho / 2;
            const alvoY = passo.y * tamanho + tamanho / 2;
            const difX = alvoX - renato.x;
            const difY = alvoY - renato.y;
            const distancia = Math.hypot(difX, difY);

            if (distancia > 1) {
              const movimento = Math.min(renato.velocidade * dt, distancia);
              const movX = difX / distancia * movimento;
              const movY = difY / distancia * movimento;

              if (podeMover(renato.x + movX, renato.y, 10)) {
                renato.x += movX;
              }

              if (podeMover(renato.x, renato.y + movY, 10)) {
                renato.y += movY;
              }
            }
          }

          if (Math.hypot(jogador.x - renato.x, jogador.y - renato.y) < 20) {
            acabou = true;
            mensagem.textContent = "Renato pegou você! Recomece para tentar de novo.";
            tocarSomAssustador();
          }
        }

        // Só permite sair depois de pegar os três itens.
        const todosPegos = itens.every(item => item.pego);
        const saidaX = saida.x * tamanho + tamanho / 2;
        const saidaY = saida.y * tamanho + tamanho / 2;
        const pertoDaSaida =
          Math.hypot(jogador.x - saidaX, jogador.y - saidaY) < 20;

        if (!acabou && pertoDaSaida && !bloqueioSaida) {
          if (todosPegos) {
            bloqueioSaida = true;
            iniciarProximaFase();

            setTimeout(() => {
              bloqueioSaida = false;
            }, 500);
          } else {
            mensagem.textContent = "A saída está trancada! Encontre os três itens.";
          }
        }
      }

      desenhar();
      requestAnimationFrame(atualizar);
    }

    document
      .getElementById("reiniciar")
      .addEventListener("click", reiniciarJogo);

    mapa = criarMapa(parte);
    atualizarInfo();
    requestAnimationFrame(atualizar);
  </script>
</body>
</html>
