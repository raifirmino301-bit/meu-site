<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas Músicas Playlist</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 18px 100px;
      background: #101116;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7852f6, #d34bb8);
      display: grid;
      place-items: center;
      font-size: 32px;
    }

    h1 { margin: 0; font-size: clamp(22px, 6vw, 34px); }
    .subtitulo { color: #aaa; margin-top: 6px; }

    button, .botao {
      border: 0;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .abas { display: flex; gap: 10px; margin: 25px 0; }

    .aba {
      padding: 12px 20px;
      border-radius: 25px;
      background: #292933;
    }

    .aba.ativa, .botao { background: #7852f6; }

    .botao {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 25px;
      margin-bottom: 15px;
    }

    #seletor { display: none; }
    .tela { display: none; }
    .tela.ativa { display: block; }

    .vazio { color: #aaa; text-align: center; margin: 30px 5px; line-height: 1.5; }

    .musica {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid #30303a;
      cursor: pointer;
    }

    .capa {
      width: 50px;
      height: 50px;
      flex: 0 0 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7852f6, #d34bb8);
      display: grid;
      place-items: center;
      font-size: 24px;
    }

    .detalhes { flex: 1; min-width: 0; }
    .nome { font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .info { color: #aaa; font-size: 13px; margin-top: 5px; }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #24242e;
      border-top: 1px solid #393943;
    }

    .player .capa { width: 44px; height: 44px; flex-basis: 44px; }
    .tocando { flex: 1; min-width: 0; }
    .controles { display: flex; gap: 5px; }
    .controle { background: transparent; font-size: 21px; padding: 5px; }
    audio { display: none; }
  </style>
</head>

<body>
  <header>
    <div class="logo" aria-label="Logo de música">🎧</div>
    <div>
      <h1>Minhas Músicas Playlist</h1>
      <div class="subtitulo">Suas músicas, do seu jeito</div>
    </div>
  </header>

  <nav class="abas">
    <button class="aba ativa" onclick="abrirTela('musicas', this)">Músicas</button>
    <button class="aba" onclick="abrirTela('playlists', this)">Playlists</button>
  </nav>

  <section id="musicas" class="tela ativa">
    <label class="botao" for="seletor">＋ Adicionar músicas</label>
    <input id="seletor" type="file" accept="audio/*" multiple>
    <div id="listaMusicas" class="vazio">
      Ainda não há músicas. Toque em “Adicionar músicas” para escolher arquivos.
    </div>
  </section>

  <section id="playlists" class="tela">
    <button class="botao" onclick="criarPlaylist()">＋ Criar playlist</button>
    <div id="listaPlaylists" class="vazio">Suas playlists aparecerão aqui.</div>
  </section>

  <div class="player">
    <div class="capa">♫</div>
    <div class="tocando">
      <div class="nome" id="nomeAtual">Nenhuma música</div>
      <div class="info">Minhas Músicas Playlist</div>
    </div>
    <div class="controles">
      <button class="controle" onclick="anterior()" aria-label="Música anterior">⏮</button>
      <button class="controle" id="botaoPlay" onclick="playPause()" aria-label="Tocar ou pausar">▶</button>
      <button class="controle" onclick="proxima()" aria-label="Próxima música">⏭</button>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const audio = document.getElementById("audio");
    const seletor = document.getElementById("seletor");
    const listaMusicas = document.getElementById("listaMusicas");
    const nomeAtual = document.getElementById("nomeAtual");
    const botaoPlay = document.getElementById("botaoPlay");

    let musicas = [];
    let indiceAtual = -1;
    let playlists = [];

    seletor.addEventListener("change", function () {
      Array.from(this.files).forEach(function (arquivo) {
        musicas.push({
          nome: arquivo.name.replace(/\.[^/.]+$/, ""),
          url: URL.createObjectURL(arquivo)
        });
      });
      mostrarMusicas();
      this.value = "";
    });

    function mostrarMusicas() {
      listaMusicas.innerHTML = "";

      if (musicas.length === 0) {
        listaMusicas.className = "vazio";
        listaMusicas.textContent = "Ainda não há músicas. Toque em “Adicionar músicas” para escolher arquivos.";
        return;
      }

      listaMusicas.className = "";
      musicas.forEach(function (musica, indice) {
        const item = document.createElement("div");
        item.className = "musica";
        item.innerHTML = '<div class="capa">♫</div><div class="detalhes"><div class="nome"></div><div class="info">Arquivo de áudio</div></div>';
        item.querySelector(".nome").textContent = musica.nome;
        item.onclick = function () { tocar(indice); };
        listaMusicas.appendChild(item);
      });
    }

    function tocar(indice) {
      if (!musicas.length) return;
      indiceAtual = indice;
      audio.src = musicas[indice].url;
      nomeAtual.textContent = musicas[indice].nome;
      audio.play();
    }

    function playPause() {
      if (indiceAtual === -1) {
        if (musicas.length) tocar(0);
      } else if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function proxima() {
      if (musicas.length) tocar((indiceAtual + 1) % musicas.length);
    }

    function anterior() {
      if (musicas.length) tocar((indiceAtual - 1 + musicas.length) % musicas.length);
    }

    audio.addEventListener("ended", proxima);
    audio.addEventListener("play", function () { botaoPlay.textContent = "⏸"; });
    audio.addEventListener("pause", function () { botaoPlay.textContent = "▶"; });

    function abrirTela(id, botao) {
      document.querySelectorAll(".tela").forEach(tela => tela.classList.remove("ativa"));
      document.getElementById(id).classList.add("ativa");
      document.querySelectorAll(".aba").forEach(aba => aba.classList.remove("ativa"));
      botao.classList.add("ativa");
    }

    function criarPlaylist() {
      const nome = prompt("Qual será o nome da playlist?");
      if (!nome || !nome.trim()) return;

      playlists.push(nome.trim());
      const area = document.getElementById("listaPlaylists");
      area.className = "";
      area.innerHTML = "";

      playlists.forEach(function (titulo) {
        const item = document.createElement("div");
        item.className = "musica";
        item.innerHTML = '<div class="capa">📁</div><div class="detalhes"><div class="nome"></div><div class="info">Playlist</div></div>';
        item.querySelector(".nome").textContent = titulo;
        area.appendChild(item);
      });
    }
  </script>
</body>
</html>
