
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuja do Renato!</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 14px;
      color: #eee8eb;
      background: radial-gradient(ellipse at center, #21151d, #08070a 75%);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 800px);
      margin: auto;
    }

    h1 {
      color: #f1dce3;
      text-shadow: 0 0 8px #ed173e, 0 0 22px #790b21;
    }

    #info, #mensagem {
      min-height: 24px;
    }

    canvas {
      display: block;
      width: min(800px, 96vw);
      height: auto;
      margin: 12px auto;
      border: 3px solid #6f263b;
      background: #09080b;
      box-shadow: 0 0 25px #000, 0 0 18px #821b35;
      touch-action: none;
    }

    #controles {
      display: grid;
      grid-template: 56px 56px / 64px 64px 64px;
      gap: 7px;
      justify-content: center;
      margin: 14px auto;
    }

    button {
      border: 2px solid #71263c;
      border-radius: 10px;
      background: #29151e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      touch-action: none;
    }

    #controles button {
      font-size: 26px;
    }

    #cima { grid-area: 1 / 2; }
    #esquerda { grid-area: 2 / 1; }
    #baixo { grid-area: 2 / 2; }
    #direita { grid-area: 2 / 3; }

    #comecar, #reiniciar, #musica {
      padding: 10px 18px;
      margin: 4px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #reiniciar {
      display: none;
    }

    #telaAviso {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #050407f2;
    }

    #caixaAviso {
      width: min(100%, 380px);
      padding: 24px;
      border: 2px solid #a32645;
      border-radius: 12px;
      background: #171016;
      box-shadow: 0 0 35px #890e31;
      line-height: 1.5;
    }

    #caixaAviso h2 {
      color: #ff526c;
    }
  </style>
</head>

<body>
  <main>
    <h1>FUJA DO RENATO</h1>
    <div id="info"></div>
    <div id="mensagem">Encontre os três itens e escape!</div>

    <canvas id="jogo" width="800" height="600"></canvas>

    <div id="controles">
      <button id="cima" aria-label="Cima">▲</button>
      <button id="esquerda" aria-label="Esquerda">◀</button>
      <button id="baixo" aria-label="Baixo">▼</button>
      <button id="direita" aria-label="Direita">▶</button>
    </div>

    <button id="reiniciar">Tentar de novo</button>
    <button id="musica">♫ Música: ligar</button>
  </main>

  <div id="telaAviso">
    <div id="caixaAviso">
      <h2>AVISO — ELE ESTÁ PERTO</h2>
      <p>
        O Renato está procurando você. Pegue os itens e encontre a saída.
        Não deixe ele chegar perto!
      </p>
      <button id="comecar">COMEÇAR</button>
    </div>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("jogo");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const mensagem = document.getElementById("mensagem");
    const telaAviso = document.getElementById("telaAviso");
    const botaoComecar = document.getElementById("comecar");
    const botaoReiniciar = document.getElementById("reiniciar");
    const botaoMusica = document.getElementById("musica");

    const TAMANHO = 25;
    const COLUNAS = 32;
    const LINHAS = 24;
    const teclas = Object.create(null);

    const nomesFases = [
      "A Casa de Renato",
      "Hospital abandonado",
      "Presídio",
      "Museu sombrio",
      "Casa de terror"
    ];

    const temas = [
      { chao: "#29252b", parede: "#514454", detalhe: "#75657a" },
      { chao: "#203137", parede: "#46616b", detalhe: "#9bcbd3" },
      { chao: "#292a32", parede: "#555565", detalhe: "#9999aa" },
      { chao: "#383124", parede: "#77613c", detalhe: "#d6bd7b" },
      { chao: "#21151d", parede: "#552b3b", detalhe: "#b75b75" }
    ];

    const saida = { x: 29, y: 2 };

    const itens = [
      { nome: "Diamante", emoji: "💎", x: 4, y: 20, pego: false },
      { nome: "Chave", emoji: "🗝️", x: 27, y: 4, pego: false },
      { nome: "Bilhete", emoji: "📜", x: 18, y: 11, pego: false }
    ];

    const bonusVelocidade = {
      x: 3,
      y: 2,
      apareceu: false,
      pego: false
    };

    let fase = 1;
    let mapa = [];
    let estado = "inicio";
    let ultimoTempo = 0;
    let tempoFase = 0;
    let pausaRenato = false;
    let tempoPausa = 0;
    let RenatoJaFicouPreso = false;
    let RenatoEstaPreso = false;
    let tempoPreso = 0;
    let bonusAte = 0;
    let musicaAtiva = false;
    let contextoMusical = null;
    let temporizadorMusical = null;
    let notaMusical = 0;

    let jogador = {
      x: 62.5,
      y: 62.5,
      velocidade: 180
    };

    let renato = {
      x: 737.5,
      y: 537.5,
      velocidade: 100
    };

    function criarMapa(numeroFase) {
      const novoMapa = Array.from({ length: LINHAS }, (_, y) =>
        Array.from({ length: COLUNAS }, (_, x) =>
          x === 0 || y === 0 ||
          x === COLUNAS - 1 || y === LINHAS - 1
            ? "#"
            : " "
        )
      );

      function paredeHorizontal(y, abertura) {
        for (let x = 2; x < COLUNAS - 2; x++) {
          if (x !== abertura) novoMapa[y][x] = "#";
        }
      }

      function paredeVertical(x, abertura) {
        for (let y = 2; y < LINHAS - 2; y++) {
          if (y !== abertura) novoMapa[y][x] = "#";
        }
      }

      if (numeroFase === 1) {
        paredeHorizontal(7, 10);
        paredeHorizontal(15, 23);
        paredeVertical(12, 10);
        paredeVertical(22, 16);
      } else if (numeroFase === 2) {
        paredeHorizontal(5, 25);
        paredeHorizontal(10, 7);
        paredeHorizontal(15, 24);
        paredeHorizontal(20, 9);
      } else if (numeroFase === 3) {
        paredeVertical(6, 18);
        paredeVertical(12, 5);
        paredeVertical(18, 18);
        paredeVertical(24, 5);
      } else if (numeroFase === 4) {
        paredeHorizontal(6, 8);
        paredeHorizontal(13, 23);
        paredeHorizontal(19, 10);
        paredeVertical(10, 17);
        paredeVertical(21, 4);
      } else {
        paredeHorizontal(4, 25);
        paredeHorizontal(8, 6);
        paredeHorizontal(12, 25);
        paredeHorizontal(16, 6);
        paredeHorizontal(20, 25);
      }

      const casasLivres = [
        [2, 2],
        [29, 21],
        [saida.x, saida.y],
        ...itens.map(item => [item.x, item.y]),
        [bonusVelocidade.x, bonusVelocidade.y]
      ];

      for (const [x, y] of casasLivres) {
        novoMapa[y][x] = " ";
      }

      
    function paredeEm(x, y) {
      const coluna = Math.floor(x / TAMANHO);
      const linha = Math.floor(y / TAMANHO);
      return !mapa[linha] || mapa[linha][coluna] !== " ";
    }
for (const [x, y] of casasLivres) {
        novoMapa[y][x] = " ";
      }

      return novoMapa;
    }

    function atualizarInfo() {
      const coletados = itens.filter(item => item.pego).length;

      info.textContent =
        `Fase ${fase}/5 — ${nomesFases[fase - 1]} — Itens: ${coletados}/3`;
    }function paredeEm(x, y) {
  const coluna = Math.floor(x / TAMANHO);
  const linha = Math.floor(y / TAMANHO);

  return !mapa[linha] || mapa[linha][coluna] !== " ";
}
    function podeMover(x, y, raio = 9) {
      return !paredeEm(x - raio, y - raio) &&
        !paredeEm(x + raio, y - raio) &&
        !paredeEm(x - raio, y + raio) &&
        !paredeEm(x + raio, y + raio);
    }

    function moverJogador(dx, dy) {
      if (estado !== "jogando") return;

      if (podeMover(jogador.x + dx, jogador.y)) {
        jogador.x += dx;
      }

      if (podeMover(jogador.x, jogador.y + dy)) {
        jogador.y += dy;
      }
    }

    function configurarControle(id, tecla) {
      const botao = document.getElementById(id);

      botao.addEventListener("pointerdown", evento => {
        evento.preventDefault();
        teclas[tecla] = true;
        botao.setPointerCapture(evento.pointerId);
      });

      const soltar = () => {
        teclas[tecla] = false;
      };

      botao.addEventListener("pointerup", soltar);
      botao.addEventListener("pointercancel", soltar);
      botao.addEventListener("lostpointercapture", soltar);
    }

    configurarControle("cima", "arrowup");
    configurarControle("baixo", "arrowdown");
    configurarControle("esquerda", "arrowleft");
    configurarControle("direita", "arrowright");

    window.addEventListener("keydown", evento => {
      const tecla = evento.key.toLowerCase();
      teclas[tecla] = true;

      if (tecla.startsWith("arrow") || tecla === " ") {
        evento.preventDefault();
      }
    });

    window.addEventListener("keyup", evento => {
      teclas[evento.key.toLowerCase()] = false;
    });

    function acharProximoPasso() {
      const inicio = {
        x: Math.floor(renato.x / TAMANHO),
        y: Math.floor(renato.y / TAMANHO)
      };

      const destino = {
        x: Math.floor(jogador.x / TAMANHO),
        y: Math.floor(jogador.y / TAMANHO)
      };

      const chave = ponto => `${ponto.x},${ponto.y}`;
      const fila = [inicio];
      const anteriores = new Map();
      anteriores.set(chave(inicio), null);

      const direcoes = [[1, 0], [-1, 0], [0, 1], [0, -1]];

      for (let i = 0; i < fila.length; i++) {
        const atual = fila[i];

        if (atual.x === destino.x && atual.y === destino.y) {
          break;
        }

        for (const [dx, dy] of direcoes) {
          const proximo = { x: atual.x + dx, y: atual.y + dy };
          const chaveProximo = chave(proximo);

          if (
            mapa[proximo.y]?.[proximo.x] !== " " ||
            anteriores.has(chaveProximo)
          ) {
            continue;
          }

          anteriores.set(chaveProximo, atual);
          fila.push(proximo);
        }
      }

      if (!anteriores.has(chave(destino))) return null;

      let passo = destino;

      while (
        anteriores.get(chave(passo)) !== null &&
        chave(anteriores.get(chave(passo))) !== chave(inicio)
      ) {
        passo = anteriores.get(chave(passo));
      }

      return passo;
    }

    function reposicionarPersonagens() {
      jogador.x = 2.5 * TAMANHO;
      jogador.y = 2.5 * TAMANHO;
      renato.x = 29.5 * TAMANHO;
      renato.y = 21.5 * TAMANHO;
    }

    function prepararFase() {
      mapa = criarMapa(fase);
      reposicionarPersonagens();

      itens.forEach(item => {
        item.pego = false;
      });

      bonusVelocidade.apareceu = false;
      bonusVelocidade.pego = false;
      jogador.velocidade = 180;
      bonusAte = 0;

      pausaRenato = false;
      tempoPausa = 0;
      tempoFase = 0;
      RenatoJaFicouPreso = false;
      RenatoEstaPreso = false;
      tempoPreso = 0;

      renato.velocidade = [0, 120, 90, 120, 140, 270][fase];

      atualizarInfo();
    }
    function tocarSomAssustador() {
      const AudioClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioClass) return;

      const audio = new AudioClass();
      const agora = audio.currentTime;
      const oscilador = audio.createOscillator();
      const ganho = audio.createGain();

      oscilador.type = "sawtooth";
      oscilador.frequency.setValueAtTime(180, agora);
      oscilador.frequency.exponentialRampToValueAtTime(38, agora + 1.1);

      ganho.gain.setValueAtTime(0.001, agora);
      ganho.gain.exponentialRampToValueAtTime(0.16, agora + 0.08);
      ganho.gain.exponentialRampToValueAtTime(0.001, agora + 1.1);

      oscilador.connect(ganho);
      ganho.connect(audio.destination);
      oscilador.start(agora);
      oscilador.stop(agora + 1.1);
      oscilador.addEventListener("ended", () => audio.close());
    }

    function tocarNota(frequencia, inicio, duracao, volume) {
      const oscilador = contextoMusical.createOscillator();
      const ganho = contextoMusical.createGain();

      oscilador.type = "sine";
      oscilador.frequency.value = frequencia;
      ganho.gain.setValueAtTime(0.0001, inicio);
      ganho.gain.exponentialRampToValueAtTime(volume, inicio + 0.15);
      ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + duracao);

      oscilador.connect(ganho);
      ganho.connect(contextoMusical.destination);
      oscilador.start(inicio);
      oscilador.stop(inicio + duracao);
    }

    function iniciarMusica() {
      const AudioClass = window.AudioContext || window.webkitAudioContext;

      if (!AudioClass) {
        mensagem.textContent = "Este navegador não permite tocar música.";
        return;
      }

      if (!contextoMusical) contextoMusical = new AudioClass();

      contextoMusical.resume();
      musicaAtiva = true;
      botaoMusica.textContent = "♫ Música: desligar";

      const notas = [130.81, 155.56, 146.83, 110, 130.81, 98];

      function tocarSequencia() {
        if (!musicaAtiva) return;

        const agora = contextoMusical.currentTime;
        tocarNota(notas[notaMusical % notas.length], agora, 1.7, 0.045);
        notaMusical++;

        temporizadorMusical = setTimeout(tocarSequencia, 1100);
      }

      tocarSequencia();
    }

    function pararMusica() {
      musicaAtiva = false;
      clearTimeout(temporizadorMusical);
      botaoMusica.textContent = "♫ Música: ligar";
    }

    botaoMusica.addEventListener("click", () => {
      if (musicaAtiva) pararMusica();
      else iniciarMusica();
    });

    function desenharPessoa(x, y, cor, tamanhoPessoa, olhosVermelhos = false) {
      ctx.save();
      ctx.shadowColor = olhosVermelhos ? "#ff001e" : cor;
      ctx.shadowBlur = olhosVermelhos ? 18 : 8;
      ctx.fillStyle = cor;
      ctx.beginPath();
      ctx.arc(x, y, tamanhoPessoa, 0, Math.PI * 2);
      ctx.fill();

      if (olhosVermelhos) {
        ctx.shadowColor = "#ff001e";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x - 5, y - 3, 2, 0, Math.PI * 2);
        ctx.arc(x + 5, y - 3, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff1737";
        ctx.beginPath();
        ctx.arc(x - 5, y - 3, 1, 0, Math.PI * 2);
        ctx.arc(x + 5, y - 3, 1, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function desenhar() {
      const tema = temas[fase - 1];
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < LINHAS; y++) {
        for (let x = 0; x < COLUNAS; x++) {
          const px = x * TAMANHO;
          const py = y * TAMANHO;

          ctx.fillStyle = mapa[y][x] === "#" ? tema.parede : tema.chao;
          ctx.fillRect(px, py, TAMANHO, TAMANHO);

          if (mapa[y][x] === "#") {
            ctx.strokeStyle = tema.detalhe;
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 1, py + 1, TAMANHO - 2, TAMANHO - 2);
          }
        }
      }

      // Saída
      ctx.fillStyle = itens.every(item => item.pego) ? "#49e878" : "#655348";
      ctx.fillRect(saida.x * TAMANHO + 3, saida.y * TAMANHO + 3, 19, 19);

      // Itens
      for (const item of itens) {
        if (item.pego) continue;

        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
          item.emoji,
          item.x * TAMANHO + TAMANHO / 2,
          item.y * TAMANHO + 20
        );
      }

      if (itens.every(item => item.pego) && (fase === 1 || fase === 5)) {
        bonusVelocidade.apareceu = true;
      }

      if (bonusVelocidade.apareceu && !bonusVelocidade.pego) {
        ctx.font = "23px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
          "⚡",
          bonusVelocidade.x * TAMANHO + TAMANHO / 2,
          bonusVelocidade.y * TAMANHO + 21
        );
      }

      desenharPessoa(jogador.x, jogador.y, "#79d8ff", 10);
      desenharPessoa(
        renato.x,
        renato.y,
        "#d62343",
        fase === 5 ? 15 : 12,
        true
      );

      // Escuridão e luz ao redor do jogador
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const raioLuz = fase === 5 ? 125 : 175;
      const luz = ctx.createRadialGradient(
        jogador.x,
        jogador.y,
        12,
        jogador.x,
        jogador.y,
        raioLuz
      );

      luz.addColorStop(0, "rgba(255,220,170,0.35)");
      luz.addColorStop(0.55, "rgba(255,220,170,0.10)");
      luz.addColorStop(1, "rgba(0,0,0,0)");

      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = luz;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      if (estado === "fim" || estado === "venceu") {
        ctx.fillStyle = "rgba(0,0,0,0.82)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 27px Arial";
        ctx.fillText(
          mensagem.textContent,
          canvas.width / 2,
          canvas.height / 2
        );
        ctx.textAlign = "left";
      }
    }
    function finalizarPartida(texto, novoEstado, textoBotao) {
      estado = novoEstado;
      mensagem.textContent = texto;
      botaoReiniciar.textContent = textoBotao;
      botaoReiniciar.style.display = "inline-block";
    }

    function atualizar(tempoAtual) {
      if (!ultimoTempo) ultimoTempo = tempoAtual;

      const dt = Math.min((tempoAtual - ultimoTempo) / 1000, 0.05);
      ultimoTempo = tempoAtual;

      if (estado === "jogando") {
        let dx = 0;
        let dy = 0;

        if (teclas.arrowup || teclas.w) dy--;
        if (teclas.arrowdown || teclas.s) dy++;
        if (teclas.arrowleft || teclas.a) dx--;
        if (teclas.arrowright || teclas.d) dx++;

        if (dx !== 0 || dy !== 0) {
          const distancia = Math.hypot(dx, dy);
          moverJogador(
            (dx / distancia) * jogador.velocidade * dt,
            (dy / distancia) * jogador.velocidade * dt
          );
        }

        // Coleta os itens.
        for (const item of itens) {
          if (item.pego) continue;

          const itemX = item.x * TAMANHO + TAMANHO / 2;
          const itemY = item.y * TAMANHO + TAMANHO / 2;

          if (Math.hypot(jogador.x - itemX, jogador.y - itemY) < 20) {
            item.pego = true;
            mensagem.textContent = `Você pegou: ${item.nome}!`;
            atualizarInfo();
          }
        }

        // O bônus aparece nas fases 1 e 5 depois de pegar todos os itens.
        const todosItensPegos = itens.every(item => item.pego);

        if (
          (fase === 1 || fase === 5) &&
          todosItensPegos &&
          !bonusVelocidade.pego
        ) {
          bonusVelocidade.apareceu = true;
        }

        if (bonusVelocidade.apareceu && !bonusVelocidade.pego) {
          const bonusX = bonusVelocidade.x * TAMANHO + TAMANHO / 2;
          const bonusY = bonusVelocidade.y * TAMANHO + TAMANHO / 2;

          if (Math.hypot(jogador.x - bonusX, jogador.y - bonusY) < 20) {
            bonusVelocidade.pego = true;
            jogador.velocidade = 320;
            bonusAte = performance.now() + 6000;
            mensagem.textContent = "Velocidade extra! Corra até a saída! ⚡";
          }
        }

        if (bonusAte && performance.now() >= bonusAte) {
          jogador.velocidade = 200;
          bonusAte = 0;
        }

        // Renato descansa por alguns segundos nas fases 1 a 4.
        if (fase < 5) {
          tempoFase += dt;

          if (!pausaRenato && tempoFase >= 20) {
            pausaRenato = true;
            tempoPausa = 0;
          }

          if (pausaRenato) {
            tempoPausa += dt;
            const faltam = Math.max(0, Math.ceil(8 - tempoPausa));
            mensagem.textContent = `Renato está descansando: ${faltam}s`;

            if (tempoPausa >= 8) {
              pausaRenato = false;
              tempoFase = 0;
              mensagem.textContent = "Renato voltou a perseguir você!";
            }
          }
        }

        // Renato fica preso uma vez na passagem da primeira fase.
        const renatoNaPassagem =
          fase === 1 &&
          Math.floor(renato.x / TAMANHO) === 10 &&
          Math.floor(renato.y / TAMANHO) === 7;

        if (renatoNaPassagem && !RenatoJaFicouPreso) {
          RenatoJaFicouPreso = true;
          RenatoEstaPreso = true;
          tempoPreso = 5;
          mensagem.textContent = "Renato ficou preso na passagem!";
        }

        if (RenatoEstaPreso) {
          tempoPreso -= dt;

          if (tempoPreso <= 0) {
            RenatoEstaPreso = false;
            mensagem.textContent = "Renato conseguiu passar!";
          }
        }
        // Renato persegue o jogador pelo labirinto.
        if (!pausaRenato && !RenatoEstaPreso) {
          const passo = acharProximoPasso();

          if (passo) {
            const alvoX = passo.x * TAMANHO + TAMANHO / 2;
            const alvoY = passo.y * TAMANHO + TAMANHO / 2;
            const difX = alvoX - renato.x;
            const difY = alvoY - renato.y;
            const distancia = Math.hypot(difX, difY);

            if (distancia > 0) {
              const movimento = Math.min(renato.velocidade * dt, distancia);
              renato.x += (difX / distancia) * movimento;
              renato.y += (difY / distancia) * movimento;
            }
          }
        }

        // Se Renato alcançar o jogador, encerra a fase.
        if (Math.hypot(jogador.x - renato.x, jogador.y - renato.y) < 20) {
          tocarSomAssustador();
          finalizarPartida(
            `Renato pegou você! Tente de novo na fase ${fase}.`,
            "fim",
            "Tentar de novo"
          );
        }

        // A saída só funciona depois que todos os itens forem encontrados.
        if (estado === "jogando" && todosItensPegos) {
          const saidaX = saida.x * TAMANHO + TAMANHO / 2;
          const saidaY = saida.y * TAMANHO + TAMANHO / 2;

          if (Math.hypot(jogador.x - saidaX, jogador.y - saidaY) < 20) {
            if (fase < 5) {
              fase++;
              prepararFase();
              estado = "jogando";
              mensagem.textContent =
                `${nomesFases[fase - 1]}: pegue os três itens e encontre a saída!`;
            } else {
              finalizarPartida(
                "Você escapou e zerou o jogo! 🏆",
                "venceu",
                "Jogar de novo"
              );
            }
          }
        }
      }

      desenhar();
      requestAnimationFrame(atualizar);
    }

    botaoComecar.addEventListener("click", () => {
      telaAviso.style.display = "none";
      fase = 1;
      prepararFase();
      estado = "jogando";
      mensagem.textContent =
        `${nomesFases[fase - 1]}: pegue os três itens e encontre a saída!`;
      ultimoTempo = performance.now();
    });

    botaoReiniciar.addEventListener("click", () => {
      if (estado === "venceu") {
        fase = 1;
      }

      prepararFase();
      estado = "jogando";
      mensagem.textContent =
        `${nomesFases[fase - 1]}: pegue os três itens e encontre a saída!`;
      botaoReiniciar.style.display = "none";
      ultimoTempo = performance.now();
    });

    // Prepara o labirinto antes de começar.
    mapa = criarMapa(fase);
    atualizarInfo();
    desenhar();
    requestAnimationFrame(atualizar);
  </script>
</body>
